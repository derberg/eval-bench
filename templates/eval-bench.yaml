# eval-bench configuration
# See https://github.com/derberg/eval-bench/blob/main/docs/config.md

plugin:
  path: ./

provider:
  command: claude
  timeout: 600
  model: claude-opus-4-7
  # Each Claude run gets its own working dir under the snapshot. By default
  # that's "{{snapshots_dir}}/{{snapshot_name}}/{{variant}}/{{prompt_id}}/{{sample}}",
  # so any files the model writes land alongside snapshot.json instead of in
  # your repo. Override with a custom path template, or set `cwd: null` to
  # inherit the cwd of the `eb` process (legacy behavior).
  # cwd: "{{snapshots_dir}}/{{snapshot_name}}/{{variant}}/{{prompt_id}}/{{sample}}"

judge:
  provider: ollama
  model: qwen2.5:14b
  endpoint: http://localhost:11434
  temperature: 0
  maxTokens: 1024
  # Override the wrapping judge prompt — replaces the default below for every
  # judge call. Must contain {{prompt}}, {{output}}, {{rubric}} placeholders.
  # The CLI flag --judge-template <inline template> takes precedence over this
  # value when both are set.
  #
  # Default (this is what's sent when `template:` stays unset):
  #
  #     You are an impartial evaluator. You are given a PROMPT, an assistant's OUTPUT,
  #     and a RUBRIC describing what a good output looks like. Grade the OUTPUT strictly by
  #     the RUBRIC.
  #
  #     Return ONLY a JSON object on a single line with exactly these fields:
  #       "score":     number in [0, 5]  (can be fractional, e.g. 3.5)
  #       "rationale": string (1-3 sentences explaining the score)
  #
  #     Do not include any other text.
  #
  #     -----
  #     PROMPT:
  #     {{prompt}}
  #     -----
  #     OUTPUT:
  #     {{output}}
  #     -----
  #     RUBRIC:
  #     {{rubric}}
  #     -----
  #
  # template: |
  #   ...your custom template here. Must contain {{prompt}}, {{output}}, {{rubric}}.

runs:
  samples: 3
  parallel: 1

snapshots:
  dir: ./.eval-bench/snapshots
